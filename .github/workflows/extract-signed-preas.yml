name: Extract signed Chinese PREAS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AFH_FILE_ID: "14655340768118464194"
      ARCHIVE_PASSWORD: "STF_HARMONY_BY https://ministryofsolutions.com"
      RELEASE_TAG: "v1.1.0"
      OUTPUT_NAME: "PREAS-signed-Huawei-140-sparse.img"

    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full erofs-utils

      - name: Resolve AndroidFileHost mirror
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl --fail --silent --show-error \
            --request POST \
            --header 'Origin: https://androidfilehost.com' \
            --header "Referer: https://androidfilehost.com/?fid=${AFH_FILE_ID}" \
            --data "submit=submit&action=getdownloadmirrors&fid=${AFH_FILE_ID}" \
            https://androidfilehost.com/libs/otf/mirrors.otf.php)
          url=$(jq -er '.MIRRORS[0].url' <<<"$json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download official HarmonyOS 2.0.0.140 DLOAD
        run: |
          aria2c --continue=true --file-allocation=none \
            --max-connection-per-server=8 --split=8 --min-split-size=20M \
            --dir="$RUNNER_TEMP" --out=firmware.zip \
            '${{ steps.mirror.outputs.url }}'
          7z t -p"$ARCHIVE_PASSWORD" "$RUNNER_TEMP/firmware.zip"

      - name: Extract UPDATE.APP
        run: |
          mkdir -p "$RUNNER_TEMP/outer" "$RUNNER_TEMP/inner"
          7z x -y -p"$ARCHIVE_PASSWORD" \
            -o"$RUNNER_TEMP/outer" "$RUNNER_TEMP/firmware.zip" \
            dload/update_sd_base.zip
          7z x -y -o"$RUNNER_TEMP/inner" \
            "$RUNNER_TEMP/outer/dload/update_sd_base.zip" UPDATE.APP
          rm -f "$RUNNER_TEMP/firmware.zip" \
            "$RUNNER_TEMP/outer/dload/update_sd_base.zip"

      - name: Extract and validate signed PREAS
        run: |
          python release-tools/extract-update-partition.py \
            "$RUNNER_TEMP/inner/UPDATE.APP" PREAS "$RUNNER_TEMP/PREAS.img"

          curl --fail --silent --show-error \
            'https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT' \
            | base64 --decode > "$RUNNER_TEMP/avbtool.py"
          python "$RUNNER_TEMP/avbtool.py" info_image --image "$RUNNER_TEMP/PREAS.img" \
            | tee "$RUNNER_TEMP/PREAS-avb.txt"
          grep -Eq 'Algorithm:[[:space:]]+SHA256_RSA2048' "$RUNNER_TEMP/PREAS-avb.txt"
          grep -Eq 'Public key \(sha1\):[[:space:]]+005f38b26728b8e065544833eac99a68e0b6bf51' \
            "$RUNNER_TEMP/PREAS-avb.txt"
          grep -Eq 'Partition Name:[[:space:]]+preas' "$RUNNER_TEMP/PREAS-avb.txt"

          mkdir -p "$RUNNER_TEMP/preas-mount"
          sudo mount -t erofs -o loop,ro "$RUNNER_TEMP/PREAS.img" "$RUNNER_TEMP/preas-mount"
          test -d "$RUNNER_TEMP/preas-mount/china"
          find "$RUNNER_TEMP/preas-mount/china" -maxdepth 2 -type d | head -100
          sudo umount "$RUNNER_TEMP/preas-mount"

      - name: Convert PREAS to exact Android sparse image
        run: |
          python release-tools/raw-to-sparse.py \
            "$RUNNER_TEMP/PREAS.img" "$RUNNER_TEMP/$OUTPUT_NAME"
          (cd "$RUNNER_TEMP" && sha256sum "$OUTPUT_NAME" | tee "$OUTPUT_NAME.sha256")

      - name: Upload PREAS to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/$OUTPUT_NAME" \
            "$RUNNER_TEMP/$OUTPUT_NAME.sha256" \
            --clobber
